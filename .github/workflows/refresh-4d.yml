name: Refresh 4D data

# Keeps the 4D hosted database growing (mirrors the TOTO workflow).
# Schedule (Singapore time = UTC+8) — 4D draws are Wed/Sat/Sun 18:30 SGT:
#   - 22:00 SGT every Wednesday (14:00 UTC)
#   - 22:00 SGT every Saturday  (14:00 UTC)
#   - 22:00 SGT every Sunday    (14:00 UTC)
# Also runnable manually via workflow_dispatch.
on:
  schedule:
    - cron: '0 14 * * 3'   # Wed 22:00 SGT
    - cron: '0 14 * * 6'   # Sat 22:00 SGT
    - cron: '0 14 * * 0'   # Sun 22:00 SGT
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate CSV + JSON (auto-backfill on first run)
        run: |
          # optional: enables the Chrome-TLS impersonation fetch fallback
          pip install --quiet curl_cffi || echo "curl_cffi unavailable - urllib only"
          if [ -f public/4d_official.csv ]; then
            rows=$(($(wc -l < public/4d_official.csv) - 1))
          else
            rows=0
          fi
          if [ "$rows" -lt 50 ]; then
            echo "Stored draws: $rows — running FULL backfill to the official archive floor (draw 5058)."
            python parse_4d.py --out public --full
          else
            echo "Stored draws: $rows — incremental refresh."
            python parse_4d.py --out public
          fi

      - name: Edge Tester battery (walk-forward report)
        run: |
          pip install numpy
          RUN_STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" python scripts/signal_lab.py \
            --csv public/4d_official.csv --out public/4d_signal_report.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/4d_official.csv public/4d_official.json public/4d_signal_report.json
          git diff --cached --quiet || git commit -m "chore: refresh 4D draws + edge report"
          git push

      # Anti-stale guard: dispatch a FRESH deploy from main's tip so the
      # live site can never serve a build missing the newest draws. (A
      # re-run of an old deploy run would rebuild the OLD commit and skip
      # the data commit this workflow just pushed.)
      - name: Force fresh Pages deploy (anti-stale)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            });
            console.log('Dispatched Deploy to GitHub Pages from main tip.');
